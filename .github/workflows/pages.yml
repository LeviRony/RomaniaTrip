name: Deploy Romania Trip to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          planner=Path('planner.js')
          q=planner.read_text(encoding='utf-8')
          planner.write_text(q,encoding='utf-8')
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          for name in ('planner','expenses-fix','car-editor','summary-v2','reminders','todo-translate','sync-migration','family-sync','trip-update','predeal-days-fix','attraction-selector','weather-fit','route-assistant','emergency','theme-toggle','date-fix','airline-checkin','home-today','compact-header','app-shell','transylvania-theme','home-dashboard','trip-metrics','home-label-fix','settings-support','home-tools','home-weather','completed-bookings-collapse'):
              s=re.sub(r'<script src="\./'+re.escape(name)+r'\.js\?v=[^"]+"></script>','',s)
          scripts='<script src="./planner.js?v=20260920-2"></script><script src="./car-editor.js?v=20260912-2"></script><script src="./summary-v2.js?v=20260918-1"></script><script src="./reminders.js?v=20260905-2"></script><script src="./todo-translate.js?v=20260912-2"></script><script src="./sync-migration.js?v=20260827-5"></script><script src="./trip-update.js?v=20260918-8"></script><script src="./family-sync.js?v=20260913-3"></script><script src="./predeal-days-fix.js?v=20260920-2"></script><script src="./attraction-selector.js?v=20260905-1"></script><script src="./weather-fit.js?v=20260905-1"></script><script src="./route-assistant.js?v=20260905-1"></script><script src="./emergency.js?v=20260905-1"></script><script src="./theme-toggle.js?v=20260913-3"></script><script src="./date-fix.js?v=20260911-1"></script><script src="./airline-checkin.js?v=20260918-5"></script><script src="./home-today.js?v=20260913-1"></script><script src="./compact-header.js?v=20260913-7"></script><script src="./app-shell.js?v=20260913-3"></script><script src="./transylvania-theme.js?v=20260913-5"></script><script src="./home-dashboard.js?v=20260918-5"></script><script src="./trip-metrics.js?v=20260918-2"></script><script src="./home-label-fix.js?v=20260913-1"></script><script src="./settings-support.js?v=20260913-2"></script><script src="./home-tools.js?v=20260913-15"></script><script src="./home-weather.js?v=20260918-3"></script><script src="./completed-bookings-collapse.js?v=20260920-2"></script>'
          nav='''<script>document.addEventListener('click',function(e){const b=e.target.closest('.nav button[data-page]');if(!b)return;const page=b.dataset.page;setTimeout(function(){document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));document.getElementById('page-'+page)?.classList.add('on');if(page==='home'&&typeof renderHome==='function')try{renderHome()}catch(e){}if(page==='summary'&&window.RomaniaSummary)try{window.RomaniaSummary.render()}catch(e){}if(page==='todo'&&window.RomaniaTodo)try{window.RomaniaTodo.render()}catch(e){}if(page==='trip'&&window.map)setTimeout(()=>window.map.invalidateSize?.(),80);window.scrollTo({top:0,behavior:'smooth'});},0)},true);</script>'''
          s=s.replace('</body>',scripts+nav+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy Romania Trip to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject planner and navigation fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          planner = '<script src="./planner.js?v=20260822-2"></script>'
          navfix = '''<script>
          document.addEventListener('click', function(e){
            const b=e.target.closest('.nav button[data-page]');
            if(!b) return;
            const page=b.dataset.page;
            setTimeout(function(){
              document.querySelectorAll('.page').forEach(function(p){p.classList.remove('on')});
              document.querySelectorAll('.nav button[data-page]').forEach(function(x){x.classList.toggle('on',x===b)});
              const target=document.getElementById('page-'+page);
              if(target) target.classList.add('on');
              if(page==='home' && typeof renderHome==='function') try{renderHome()}catch(_e){}
              if(page==='trip'){
                try{ if(typeof installRouteEditor==='function') installRouteEditor(); }catch(_e){}
                try{ if(typeof renderRouteEditor==='function') renderRouteEditor(); }catch(_e){}
                try{ if(window.map && typeof map.invalidateSize==='function') setTimeout(function(){map.invalidateSize()},80); }catch(_e){}
              }
              window.scrollTo({top:0,behavior:'smooth'});
            },0);
          },true);
          </script>'''
          import re
          s = re.sub(r'<script src="\./planner\.js\?v=[^"]+"></script>', '', s)
          s = s.replace('</body>', planner + navfix + '</body>')
          p.write_text(s, encoding='utf-8')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
